name: Build

# Fork Valblock : compile le jar du plugin a chaque push et sur chaque PR,
# et le publie en artefact (onglet Actions > run > Artifacts).
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pour deposer le jar sur la branche build-jar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Gradle 8.14.x cannot run on JDK 25 builds with 4-component versions
          # (Kotlin DSL crashes parsing e.g. "25.0.4.1"): Gradle itself runs on
          # JDK 21 (last entry = JAVA_HOME), JDK 25 is only the compile toolchain.
          java-version: |
            25
            21
          cache: gradle

      - name: Build plugin jar and run tests
        run: bash ./gradlew :paper:shadowJar test --no-daemon --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: UnlimitedNametags
          path: target/UnlimitedNametags.jar
          if-no-files-found: error

      # Le jar est aussi depose sur la branche build-jar (un seul fichier,
      # historique ecrase) : on le recupere avec un simple git fetch, sans
      # passer par le stockage des artefacts.
      - name: Publish jar to build-jar branch
        if: github.event_name == 'push'
        run: |
          set -e
          mkdir -p /tmp/jar && cp target/UnlimitedNametags.jar /tmp/jar/
          cd /tmp/jar
          git init -q -b build-jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Source: ${GITHUB_REPOSITORY}@${GITHUB_SHA} (${GITHUB_REF_NAME})" > SOURCE.txt
          git add UnlimitedNametags.jar SOURCE.txt
          git commit -q -m "UnlimitedNametags.jar from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" build-jar
