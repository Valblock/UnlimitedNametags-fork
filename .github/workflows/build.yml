name: Build

# Fork Valblock : compile le jar du plugin a chaque push et sur chaque PR,
# et le publie en artefact (onglet Actions > run > Artifacts).
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Gradle 8.14.x cannot run on JDK 25 builds with 4-component versions
          # (Kotlin DSL crashes parsing e.g. "25.0.4.1"): Gradle itself runs on
          # JDK 21 (last entry = JAVA_HOME), JDK 25 is only the compile toolchain.
          java-version: |
            25
            21
          cache: gradle

      - name: Build plugin jar and run tests
        run: bash ./gradlew :paper:shadowJar test --no-daemon --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: UnlimitedNametags
          path: target/UnlimitedNametags.jar
          if-no-files-found: error
